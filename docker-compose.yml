services:
  postgres:
    image: postgres:19
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # A partir do 18 a imagem usa PGDATA=/var/lib/postgresql/<major>/docker
      - pgdata19:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  # --noeviction: o BullMQ (fase 12) exige; todo dado de cache aqui precisa ter TTL
  redis:
    image: redis:8
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata19:
  redisdata:
