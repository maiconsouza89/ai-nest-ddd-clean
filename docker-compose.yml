# Env dos serviços do profile `prod`, que testam a imagem de produção localmente: o mínimo para a
# validação passar. Os valores são só locais; em produção, cada um vem do ambiente da plataforma.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
  REDIS_URL: redis://redis:6379
  JWT_SECRET: so-local-nao-use-em-producao-0123456789
  SMTP_URL: smtp://mailpit:1025
  EMAIL_FROM: App <no-reply@example.com>
  # sem coletor, os três em none (docs/reference/variaveis-de-ambiente.md)
  OTEL_TRACES_EXPORTER: none
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

services:
  # Profile `prod`: roda as migrations da imagem e depois sobe a app, na ordem do deploy. Fora do `up`
  # de sempre. Como usar: docs/how-to/testar-a-imagem-de-producao-localmente.md
  migrate:
    profiles: [prod]
    build: .
    image: ai-nest-ddd-clean:local
    command: ['npm', 'run', 'db:migrate:prod']
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  # Mesma porta do start:dev, de propósito: com ele no ar, este não sobe, em vez de duas instâncias
  # disputarem as filas do BullMQ no mesmo Redis. O profile só roda no checkout principal: o stack de
  # desenvolvimento é o de todos os worktrees (docs/how-to/testar-a-imagem-de-producao-localmente.md)
  app:
    profiles: [prod]
    image: ai-nest-ddd-clean:local
    ports:
      - '127.0.0.1:3000:3000'
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Os worktrees compartilham este Postgres, um banco por worktree (docs/how-to/trabalhar-com-worktrees-em-paralelo.md)
  postgres:
    image: postgres:19
    command: ['postgres', '-c', 'max_connections=200']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # A partir do 18 a imagem usa PGDATA=/var/lib/postgresql/<major>/docker
      - pgdata19:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  # --noeviction: o BullMQ exige; todo dado de cache aqui precisa ter TTL
  redis:
    image: redis:8
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP de desenvolvimento: guarda os e-mails e os mostra em http://localhost:8025, sem enviar para fora
  mailpit:
    image: axllent/mailpit:v1
    # Aceita envio sem autenticação (o checkout principal e o CI) e marca cada e-mail com o usuário SMTP:
    # cada worktree envia como `wt<N>` e o filtra por `tag:wt<N>`
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_TAGS_USERNAME: 1
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata19:
  redisdata:
