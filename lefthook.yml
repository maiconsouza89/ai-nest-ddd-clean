# Hooks do git e como pulá-los: docs/reference/comandos.md#hooks-do-git
glob_matcher: doublestar

pre-commit:
  piped: true
  skip: [merge, rebase]
  jobs:
    - name: prettier
      tags: [prettier]
      run: npx --no -- prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: eslint
      tags: [eslint]
      glob: '**/*.{ts,mts,cts,js,mjs,cjs}'
      run: npx --no -- eslint --max-warnings 0 --no-warn-ignored {staged_files}
    - name: markdownlint
      tags: [markdownlint]
      glob: '**/*.md'
      run: npx --no -- markdownlint-cli2 --no-globs {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      tags: [commitlint]
      run: npx --no -- commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      tags: [typecheck]
      run: npm run typecheck
    - name: arch
      tags: [arch]
      run: npm run arch
