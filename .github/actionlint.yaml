# O GitHub Actions aceita `command` em `services:`, mas o actionlint 1.7.12 ainda não conhece a chave.
# Também não conhece o `$/`, a referência do lockfile (`gh actions-lock`) a uma action do próprio
# repositório. Tire cada exceção quando ele conhecer.
paths:
  .github/workflows/ci.yml:
    ignore:
      - 'unexpected key "command" for "services" section'
      - 'specifying action "\$/\.github/actions/setup" in invalid format'
