name: Bug
description: Algo não funciona como a documentação diz.
labels: [bug]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: A mensagem de erro, a resposta da API ou o comportamento observado.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
      description: O comportamento certo, com o link da página de `docs/` que o descreve, se houver.
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir
      description: Os comandos ou as requisições, a partir de um clone limpo.
      placeholder: |
        1. npm run db:setup
        2. POST /v1/...
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Commit e versão do Node
      placeholder: 21d61b1, Node 24.11.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: A saída relevante. Tire tokens, senhas e dados pessoais.
      render: text
