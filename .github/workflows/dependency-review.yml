# Barra o PR que traz dependência com vulnerabilidade high ou licença fora da lista: docs/reference/comandos.md#ci
# O ruleset de scripts/setup-github.mjs exige o check dependency-review: ao renomear o job, mude lá e
# rode npm run github:setup.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: high
          # As licenças permissivas da árvore. Uma copyleft entra só como exceção de pacote, abaixo.
          allow-licenses: >-
            MIT, MIT-0, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0,
            CC-BY-3.0, PSF-2.0, Unlicense
          # MPL-2.0 (copyleft por arquivo), só em desenvolvimento: o lightningcss do vite, com os
          # binários por plataforma
          allow-dependencies-licenses: >-
            pkg:npm/lightningcss, pkg:npm/lightningcss-android-arm64,
            pkg:npm/lightningcss-darwin-arm64, pkg:npm/lightningcss-darwin-x64,
            pkg:npm/lightningcss-freebsd-x64, pkg:npm/lightningcss-linux-arm-gnueabihf,
            pkg:npm/lightningcss-linux-arm64-gnu, pkg:npm/lightningcss-linux-arm64-musl,
            pkg:npm/lightningcss-linux-x64-gnu, pkg:npm/lightningcss-linux-x64-musl,
            pkg:npm/lightningcss-win32-arm64-msvc, pkg:npm/lightningcss-win32-x64-msvc
          comment-summary-in-pr: on-failure
