# Análise de segurança do código e dos workflows com o CodeQL: docs/reference/comandos.md#ci
# A regra code_scanning do ruleset (scripts/setup-github.mjs) barra o PR até esta análise terminar.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Domingo de madrugada em UTC, fora da agenda do Dependabot
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4.39.5
        with:
          category: '/language:${{ matrix.language }}'
