# O que roda em PR e na main: docs/reference/comandos.md#ci
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo PR cancela a execução anterior. Na main, cada push tem o seu grupo (run_id):
# um grupo compartilhado descartaria a execução pendente quando chegasse uma terceira.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Em PR, o checkout é o merge do PR na base, e o primeiro pai dele é a base: HEAD^1 basta, com
  # fetch-depth 2. Os testes rodam só o que o diff afeta (forceRerunTriggers no vitest.config.ts).
  VITEST_ARGS: ${{ github.event_name == 'pull_request' && '--changed HEAD^1 --passWithNoTests' || '' }}

jobs:
  # O filtro de PR só de Markdown fica aqui, e não no gatilho, para os checks continuarem aparecendo
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        if: github.event_name == 'pull_request'
        run: |
          # Sem -q: o grep lê o diff inteiro, e o git diff não morre de SIGPIPE sob o pipefail
          if git diff --name-only HEAD^1...HEAD | grep -vE '\.md$|^docs/' > /dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
        with:
          node-version-file: .nvmrc
      - run: npm run ci:static
      - run: npm run audit:signatures

  # Só a entrada .nvmrc mede a cobertura: medir nas duas repetiria o mesmo número. Ela roda os unitários
  # inteiros também em PR, sem o --changed: com ele, o relatório e a meta ficariam só com os arquivos do diff.
  unit:
    name: unit (Node ${{ matrix.node-version || '.nvmrc' }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: '22.22.3' # mínimo do engines.node
          - node-version-file: .nvmrc
            coverage: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: $/.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
      - if: '!matrix.coverage'
        run: npm test -- ${{ env.VITEST_ARGS }}
      - if: matrix.coverage
        run: npm run test:coverage
      # Também quando a meta falha, que grava o relatório antes; sem relatório (um teste falhou) ou numa
      # execução cancelada, não roda
      - if: "!cancelled() && matrix.coverage && hashFiles('coverage/coverage-summary.json') != ''"
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: $/.github/actions/setup
        with:
          node-version-file: .nvmrc
      - run: npm run test:int -- ${{ env.VITEST_ARGS }}

  # Imagens do docker-compose.yml e portas que o test/setup-env.ts espera; o Postgres sem durabilidade
  # e em tmpfs, como o da integração (test/global-setup/int.ts). Os services sobem e esperam o
  # healthcheck antes do primeiro step, uns 15 s.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        command: -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        ports: ['5432:5432']
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 2s --health-timeout 3s --health-retries 30
      # noeviction: o BullMQ exige
      redis:
        image: redis:8
        command: redis-server --maxmemory-policy noeviction
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: $/.github/actions/setup
        with:
          node-version-file: .nvmrc
      # O mesmo setup do ambiente local: as URLs do .env.example apontam para as portas dos services
      - run: cp .env.example .env
      - run: npm run db:setup
      - run: npm run test:e2e -- ${{ env.VITEST_ARGS }}

  # Quebra do contrato HTTP: compara o openapi.json do PR com o da base (docs/reference/comandos.md#ci).
  # O HEAD^1 é a ponta da base, como no VITEST_ARGS, e os dois arquivos são os guardados: o check
  # garante, pelo openapi:check, que o do PR está atualizado. Na main não há base para comparar.
  # O binário do release, e não a oasdiff/oasdiff-action: ela monta a imagem de uma tag Docker mutável,
  # que o actions.lock não cobre, e manda os documentos para o oasdiff.com por padrão. O Dependabot não
  # atualiza o binário: a versão e o SHA-256 ficam no env abaixo, e se conferem à mão
  # (docs/reference/versoes-e-excecoes.md#atualização-automática).
  openapi:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      OASDIFF_VERSION: 1.41.0
      # SHA-256 do oasdiff_<versão>_linux_amd64.tar.gz, igual ao do checksums.txt do release
      OASDIFF_SHA256: 96365453163118e6503eb71742643d9ee67f91aedbaadd1a1ce9c6213e3b71c7
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: base
        run: |
          if git cat-file -e HEAD^1:openapi.json 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::A base não tem o openapi.json: nada para comparar."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.base.outputs.exists == 'true'
        run: |
          tarball="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$tarball"
          echo "$OASDIFF_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" oasdiff
      - if: steps.base.outputs.exists == 'true'
        run: >-
          "$RUNNER_TEMP/oasdiff" breaking HEAD^1:openapi.json HEAD:openapi.json
          --config .github/oasdiff/config.yaml -f githubactions

  # Um dos três checks obrigatórios do PR, com o dependency-review e o verify-lockfile; a regra
  # code_scanning do ruleset também espera o CodeQL. Tem nome fixo, e um job pulado (PR só de docs)
  # conta como aprovado: a matriz do unit pulada não expande, e o nome dela não serve como check
  # obrigatório. Cobre também o openapi, que só roda em PR. O ruleset de scripts/setup-github.mjs exige
  # este nome: ao renomear o job, mude lá e rode npm run github:setup.
  ci:
    if: always()
    needs: [changes, check, unit, integration, e2e, openapi]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
