# Atualização automática das dependências: docs/reference/versoes-e-excecoes.md#atualização-automática
# O ignore espelha a tabela de exceções (docs/reference/versoes-e-excecoes.md#exceções): uma linha
# nova, mudada ou removida lá muda o ignore aqui, no mesmo PR.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    versioning-strategy: increase
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      opentelemetry:
        patterns: ['@opentelemetry/*']
      testcontainers:
        patterns: ['testcontainers', '@testcontainers/*']
      typescript-eslint:
        patterns: ['typescript-eslint', '@typescript-eslint/*']
      vitest:
        patterns: ['vitest', '@vitest/*']
    ignore:
      # Regressão do applyDecorators na 12.6.1 (nestjs/nest#18709): docs/reference/versoes-e-excecoes.md#exceções
      - dependency-name: '@nestjs/common'
        versions: ['12.6.1']
      - dependency-name: '@nestjs/core'
        versions: ['12.6.1']
      - dependency-name: '@nestjs/platform-express'
        versions: ['12.6.1']
      - dependency-name: '@nestjs/testing'
        versions: ['12.6.1']
      # O @nestjs/cli e o typescript-eslint não aceitam o TS 6.1 ou acima: docs/reference/versoes-e-excecoes.md#exceções
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # O cache-manager depende da keyv 5: docs/reference/versoes-e-excecoes.md#exceções
      - dependency-name: keyv
        update-types: ['version-update:semver-major']
      - dependency-name: '@keyv/redis'
        update-types: ['version-update:semver-major']
      # O typeorm aceita só o ioredis 5: docs/reference/versoes-e-excecoes.md#exceções
      - dependency-name: ioredis
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 3
