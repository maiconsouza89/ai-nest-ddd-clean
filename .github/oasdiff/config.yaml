# Config do oasdiff breaking, no job openapi do ci.yml e no comando local: docs/reference/comandos.md#ci
# Os caminhos abaixo são relativos a esta pasta. O severity-levels.txt não aceita comentário: o motivo
# de cada linha dele fica na página.
fail-on: ERR
severity-levels: severity-levels.txt
err-ignore: err-ignore.txt
# Junta os ramos do allOf antes de comparar. Sem isso, um campo tirado de dentro de um allOf (o envelope
# da paginação, ApiPageResponse) só dá WARN e não falha o job.
flatten-allof: true
